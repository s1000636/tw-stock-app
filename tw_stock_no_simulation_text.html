-size:17px}.divider{height:9px;background:#050608}.sortbar{height:60px;display:flex;align-items:flex-start;gap:13px;padding:12px 15px;color:var(--muted);font-size:14px;white-space:nowrap;overflow:auto;scrollbar-width:none}.sortbar::-webkit-scrollbar{display:none}.sortbar button{background:none;border:0;color:inherit;padding:3px 0;white-space:nowrap}.sortbar .filter{color:#fff;border:1px solid #363c46;border-radius:3px;padding:5px 8px;margin-top:-3px}.empty{height:calc(100dvh - 445px);min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:50px;color:#98a5b9;text-align:center;font-size:16px;line-height:1.5}.empty-art{height:102px;width:140px;position:relative;margin-bottom:12px;opacity:.55}.empty-art:before{content:'';position:absolute;left:34px;top:0;width:76px;height:94px;border-radius:4px;background:linear-gradient(150deg,#69717c,#242932);box-shadow:0 12px 28px #0005}.empty-art:after{content:'━━━━\A • • • •\A ━━━';white-space:pre;position:absolute;top:13px;left:53px;color:#9ca4b0;opacity:.4;font-size:13px;line-height:17px}.empty .date{font-size:14px}.bottom{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);height:calc(85px + env(safe-area-inset-bottom));background:#1b1e24;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);align-items:start}.nav{background:none;border:0;color:#f2f3f5;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0 0;font-size:16px;font-weight:600}.nav.active{color:var(--red)}.nav svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}.nav.order{margin-top:-10px;padding:0}.order-circle{background:#c62820;border:1px solid #ef5b4c;border-radius:50%;width:80px;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 24px #e33d3a35;color:white}.order-circle svg{height:30px;width:30px;stroke-width:3}.order-circle span{font-size:16px}.page{display:none}.page.active{display:block}.panel{padding:18px 16px}.panel h2{margin:0 0 16px;font-size:22px}.stock{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.stock small{display:block;color:var(--muted);margin-top:4px}.stock b{font-size:20px}.stock .positive{color:var(--red)}.stock .negative{color:#3cbf81}.chip{background:#252a32;border:1px solid #424853;border-radius:5px;color:#fff;padding:7px 12px}.hold{padding:16px;border-bottom:1px solid var(--line)}.hold .row{display:flex;justify-content:space-between;align-items:center}.hold .sub{display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:13px}.overlay{display:none;position:fixed;z-index:50;inset:0;background:#000a;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:#22262e;border-radius:18px 18px 0 0;width:min(100%,520px);padding:20px 18px calc(28px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}.sheet h2{margin:0 0 17px;font-size:21px}.sheet .close{float:right;background:none;color:#fff;border:0;font-size:25px}.field{margin:13px 0}.field label{display:block;color:#aab3c2;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #515a66;border-radius:7px;background:#15181e;color:white;padding:12px;font-size:16px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{width:100%;padding:13px;border:0;border-radius:8px;background:#d73530;color:white;font-size:17px;font-weight:700;margin-top:12px}.action.sell{background:#23885c}.seg{display:flex;gap:8px}.seg button{flex:1;padding:9px;background:#343a44;color:white;border:1px solid #4a5360;border-radius:5px}.seg button.selected{background:#a62d29;border-color:#e44c43}.notice{font-size:12px;color:#9faaba;margin-top:12px;line-height:1.6}.toast{position:fixed;z-index:100;left:50%;bottom:120px;transform:translateX(-50%);background:#e8e9ec;color:#111;padding:10px 17px;border-radius:8px;display:none;white-space:nowrap}.empty-small{text-align:center;color:#aab4c2;padding:75px 10px}.demo-label{font-size:10px;color:#8c97a8;border:1px solid #4b5564;border-radius:3px;padding:2px 4px;vertical-align:middle}.toggle{display:flex;align-items:center;gap:8px;padding:9px 0;color:#cbd2dc}.toggle input{accent-color:#d93932} @media(max-width:380px){.ticker{font-size:13px}.ticker b{font-size:16px}.sortbar{gap:10px;font-size:12px}.sum-head h2{font-size:20px}}

<section id="holdings" class="page active"><div class="summary"><div class="sum-head"><h2>庫存總市值</h2><span class="tag">♧ 含息、含稅</span><button class="update" onclick="refresh()">更新</button></div><div class="total"><small>NTD</small><strong id="total">--</strong></div><div class="metrics"><div class="metric">損益試算<span id="pnl">--</span></div><div class="metric">報酬率<span id="roi">--</span></div><div class="metric">總付出成本<span id="cost">--</span></div></div></div><div class="divider"></div><div class="sortbar"><button class="filter" onclick="openFilter()">▽ 篩選</button><button onclick="sortBy('type')">↕類別</button><button onclick="sortBy('value')">↕庫存股/現值</button><button onclick="sortBy('pnl')">↕損益/報酬率</button></div><div id="holding-content"></div></section>
<section id="pick" class="page"><div class="panel"><h2>選股</h2><p style="color:#aab4c2">點選股票可帶入模擬下單。</p><div id="pick-list"></div></div></section><section id="watch" class="page"><div class="panel"><h2>自選股</h2><div id="watch-list"></div></div></section><section id="account" class="page"><div class="panel"><h2>帳務總覽</h2><div class="stock"><span>模擬可用資金</span><b id="cash">NTD 2,000,000</b></div><div class="stock"><span>模擬庫存市值</span><b id="account-value">NTD 0</b></div><div class="stock"><span>模擬總資產</span><b id="assets">NTD 2,000,000</b></div><h2 style="margin-top:30px">委託紀錄</h2><div id="orders-list"></div><button class="chip" style="margin-top:20px" onclick="resetDemo()">重設示範帳戶</button><p class="notice">本系統僅為介面與交易流程展示。行情、庫存、成交及資金均為模擬，不連接任何券商。</p></div></section>

<div class="overlay" id="order-modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2>模擬股票下單 <span class="demo-label">DEMO</span></h2><div class="seg"><button id="buybtn" class="selected" onclick="setSide('buy')">買進</button><button id="sellbtn" onclick="setSide('sell')">賣出</button></div><div class="field"><label>股票</label><select id="stock-select" onchange="setStockPrice()"></select></div><div class="pair"><div class="field"><label>委託方式</label><select id="order-type" onchange="togglePrice()"><option value="limit">限價</option><option value="market">市價（模擬）</option></select></div><div class="field"><label>交易單位</label><select id="unit"><option value="1000">整股（張）</option><option value="1">零股（股）</option></select></div></div><div class="pair"><div class="field"><label>價格（元）</label><input type="number" id="price" min="0.01" step="0.01"></div><div class="field"><label>數量</label><input type="number" id="qty" min="1" value="1" step="1"></div></div><button class="action" id="submit-order" onclick="submitOrder()">確認模擬買進</button><p class="notice">展示系統使用你提供的固定參考價格，委託會以設定價格立即模擬成交，不涉及真實交易。</p></div></div>
<div class="overlay" id="filter-modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2>庫存篩選</h2><label class="toggle"><input id="only-gain" type="checkbox"> 僅顯示獲利庫存</label><label class="toggle"><input id="only-loss" type="checkbox"> 僅顯示虧損庫存</label><button class="action" onclick="applyFilter()">套用篩選</button></div></div><div class="overlay" id="search-modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2>股票搜尋</h2><div class="field"><input id="search-input" placeholder="輸入股票代號或名稱" oninput="searchStocks()"></div><div id="search-results"></div></div></div><div class="toast" id="toast"></div><div id="runtime-error" role="alert" style="display:none;position:fixed;z-index:200;top:8px;left:8px;right:8px;padding:12px;background:#8e1e1e;color:#fff;border-radius:8px;font-size:13px"></div>
<script>
const stocks=[{id:'2303',name:'聯電',price:96.7,change:0},{id:'00981A',name:'00981A',price:23.06,change:0},{id:'00988A',name:'00988A',price:12.6,change:0},{id:'3034',name:'聯詠',price:486.5,change:0},{id:'2330',name:'台積電',price:1480,change:0},{id:'2317',name:'鴻海',price:224,change:0}];const KEY='tw_broker_demo_v4_holdings';let memoryStore=null;function safeRead(){try{return localStorage.getItem(KEY)}catch(e){return memoryStore}}function safeWrite(v){memoryStore=v;try{localStorage.setItem(KEY,v)}catch(e){}}let state;try{state=JSON.parse(safeRead())}catch(e){}if(!state||typeof state.cash!=='number')state={cash:2000000,holdings:{'2303':{qty:5000,cost:690000},'00981A':{qty:43000,cost:1011360},'00988A':{qty:30000,cost:553500},'3034':{qty:1000,cost:410000}},orders:[]};let side='buy',sorting='type',sortReverse=false,filters={gain:false,loss:false};const $=id=>document.getElementById(id),money=n=>Math.round(n).toLocaleString('en-US'),save=()=>safeWrite(JSON.stringify(state));function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2200)}function go(page){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===page));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.nav===page));render()}function closeModal(){document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('show'))}function openOrder(id){if(id)$('stock-select').value=id;setStockPrice();$('order-modal').classList.add('show')}function setSide(v){side=v;$('buybtn').classList.toggle('selected',v==='buy');$('sellbtn').classList.toggle('selected',v==='sell');$('submit-order').textContent='確認模擬'+(v==='buy'?'買進':'賣出');$('submit-order').classList.toggle('sell',v==='sell')}function setStockPrice(){const s=stocks.find(s=>s.id===$('stock-select').value);if(s)$('price').value=s.price}function togglePrice(){$('price').disabled=$('order-type').value==='market';if($('price').disabled)setStockPrice()}function submitOrder(){const s=stocks.find(x=>x.id===$('stock-select').value),p=$('order-type').value==='market'?s.price:Number($('price').value),qty=Number($('qty').value)*Number($('unit').value);if(!Number.isFinite(p)||p<=0||!Number.isSafeInteger(qty)||qty<=0){toast('請輸入有效價格與數量');return}const amount=p*qty,h=state.holdings[s.id]||{qty:0,cost:0};if(side==='buy'){if(amount>state.cash){toast('模擬可用資金不足');return}state.cash-=amount;h.qty+=qty;h.cost+=amount;state.holdings[s.id]=h}else{if(h.qty<qty){toast('庫存數量不足');return}const avg=h.cost/h.qty;state.cash+=amount;h.qty-=qty;h.cost=Math.max(0,h.cost-avg*qty);if(h.qty===0)delete state.holdings[s.id];else state.holdings[s.id]=h}state.orders.unshift({id:Date.now(),stock:s.id,name:s.name,side,qty,price:p,time:new Date().toLocaleString('zh-TW'),status:'模擬成交'});save();closeModal();render();toast('模擬'+(side==='buy'?'買進':'賣出')+'成交成功')}function render(){let total=0,cost=0;let entries=Object.entries(state.holdings).map(([id,h])=>{const s=stocks.find(x=>x.id===id),value=s.price*h.qty,pnl=value-h.cost;total+=value;cost+=h.cost;return {...s,...h,value,pnl}});$('total').textContent=entries.length?money(total):'--';$('pnl').textContent=entries.length?(total-cost>=0?'+':'')+money(total-cost):'--';$('roi').textContent=entries.length&&cost?((total-cost)/cost*100).toFixed(2)+'%':'--';$('cost').textContent=entries.length?money(cost):'--';$('cash').textContent='NTD '+money(state.cash);$('account-value').textContent='NTD '+money(total);$('assets').textContent='NTD '+money(state.cash+total);if(sorting==='value')entries.sort((a,b)=>b.value-a.value);if(sorting==='pnl')entries.sort((a,b)=>b.pnl-a.pnl);if(sorting==='type')entries.sort((a,b)=>a.id.localeCompare(b.id));if(sortReverse)entries.reverse();entries=entries.filter(h=>(!filters.gain||h.pnl>0)&&(!filters.loss||h.pnl<0));$('holding-content').innerHTML=entries.length?entries.map(h=>{const displayName=({'00981A':'主動統一<br>台股增長','00988A':'主動統一<br>全球創新','2303':'聯電','3034':'聯詠'})[h.id]||h.name;const pc=h.cost?h.pnl/h.cost*100:0;const color=h.pnl>=0?'#f04a42':'#37b985';return `<div class="hold"><div class="hold-grid"><div class="hold-identity"><div class="hold-name">${displayName}</div><div class="hold-code">${h.id}</div></div><div class="hold-type">現股</div><div class="hold-numbers"><div>${money(h.qty)}</div><div>${money(h.value)}</div></div><div class="hold-pnl" style="color:${color}"><div>${h.pnl>0?'+':''}${money(h.pnl)}</div><div>${pc>0?'+':''}${pc.toFixed(2)}%</div></div><button class="hold-more" aria-label="${h.name}操作選單" onclick="holdingActions('${h.id}')">⋯</button></div></div>`}).join(''):`<div class="empty"><div class="empty-art"></div><div>暫無庫存資料</div><div class="date">更新時間：${new Date().toLocaleString('zh-TW')}</div></div>`;const stockList=stocks.map(s=>`<div class="stock"><div><b>${s.name}</b><small>${s.id} · 展示價格（非即時）</small></div><div style="text-align:right"><b class="${s.change>=0?'positive':'negative'}">${s.price.toFixed(2)}</b><small>${s.change>=0?'+':''}${s.change}%</small><button class="chip" style="margin-top:6px" onclick="openOrder('${s.id}')">下單</button></div></div>`).join('');$('pick-list').innerHTML=stockList;$('watch-list').innerHTML=stockList;$('orders-list').innerHTML=state.orders.length?state.orders.map(o=>`<div class="stock"><div><b>${o.name}</b><small>${o.time}</small></div><div style="text-align:right"><b style="color:${o.side==='buy'?'#f03832':'#3cbf81'}">${o.side==='buy'?'買進':'賣出'} ${o.qty}股</b><small>${o.price}元 · ${o.status}</small></div></div>`).join(''):'<div class="empty-small">暫無委託紀錄</div>'}function holdingActions(id){const h=state.holdings[id];const st=stocks.find(x=>x.id===id);if(!h||!st)return;const choice=confirm(st.name+'（'+id+'）\n股數：'+money(h.qty)+' 股\n平均成本：'+(h.cost/h.qty).toFixed(2)+' 元\n展示現價：'+st.price.toFixed(2)+' 元\n\n按「確定」進入模擬賣出，按「取消」返回庫存');if(choice){setSide('sell');openOrder(id)}}function refresh(){render();toast('示範資料已更新')}function sortBy(k){if(sorting===k)sortReverse=!sortReverse;else{sorting=k;sortReverse=false}render()}function openFilter(){$('filter-modal').classList.add('show')}function applyFilter(){filters={gain:$('only-gain').checked,loss:$('only-loss').checked};closeModal();render()}function openSearch(){$('search-modal').classList.add('show');$('search-input').value='';searchStocks()}function searchStocks(){const q=$('search-input').value.trim();$('search-results').innerHTML=stocks.filter(s=>s.id.includes(q)||s.name.includes(q)).map(s=>`<div class="stock"><span>${s.id} ${s.name}</span><button class="chip" onclick="closeModal();openOrder('${s.id}')">下單</button></div>`).join('')||'<p>找不到符合的示範股票</p>'}function resetDemo(){if(!confirm('確定重設所有模擬資金、庫存與成交紀錄？'))return;state={cash:2000000,holdings:{'2303':{qty:5000,cost:690000},'00981A':{qty:43000,cost:1011360},'00988A':{qty:30000,cost:553500},'3034':{qty:1000,cost:410000}},orders:[]};save();render();toast('已還原展示庫存')}$('stock-select').innerHTML=stocks.map(s=>`<option value="${s.id}">${s.id} ${s.name}</option>`).join('');setStockPrice();go('holdings');document.querySelectorAll('button').forEach(b=>b.setAttribute('type','button'));window.addEventListener('error',function(e){var x=document.getElementById('runtime-error');if(x){x.textContent='操作程式發生錯誤：'+e.message;x.style.display='block'}});
